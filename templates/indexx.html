<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Verification Terminal</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f8fafc; 
            --text: #1e293b; 
            /* Added colors for feedback */
            --success-bg: #ecfdf5;
            --success-border: #16a34a;
            --error-bg: #fef2f2;
            --error-border: #dc2626;
        }
        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .container {
            background: white; width: 100%; max-width: 600px;
            padding: 40px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { margin: 0 0 30px 0; font-size: 24px; text-align: center; }
        
        .input-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        select {
            width: 100%; padding: 12px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 16px; background: white;
        }
        
        .typing-area {
            position: relative; margin-bottom: 25px;
        }
        .target-phrase {
            background: #f1f5f9; padding: 15px; border-radius: 8px 8px 0 0;
            font-family: monospace; color: #64748b; font-size: 14px;
            border: 2px solid #e2e8f0; border-bottom: none;
            user-select: none;
        }
        textarea {
            width: 100%; height: 100px; padding: 15px;
            border: 2px solid #e2e8f0; border-radius: 0 0 8px 8px;
            font-family: monospace; font-size: 16px; resize: none;
            display: block; box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: var(--primary); }
        
        /* NEW: Styles for visual feedback */
        textarea.success {
            background: var(--success-bg);
            border-color: var(--success-border);
        }
        textarea.error {
            background: var(--error-bg);
            border-color: var(--error-border);
        }
        
        .status-bar {
            height: 4px; background: #e2e8f0; margin-top: 10px; border-radius: 2px;
            overflow: hidden;
        }
        .status-fill {
            height: 100%; width: 0%; background: var(--primary); transition: width 0.2s;
        }
        
        .result-overlay {
            margin-top: 20px; padding: 20px; border-radius: 8px;
            text-align: center; display: none;
        }
        .success-box { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .fail-box { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        
        button {
            width: 100%; padding: 15px; background: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; font-size: 16px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .tip {
            font-size: 12px; color: #64748b; margin-top: 5px; text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 Secure Verification</h1>
    
    <div class="input-group">
        <label>Select User to Verify</label>
        <select id="userSelect">
            <option value="">Loading users...</option>
        </select>
    </div>

    <div class="typing-area">
        <div class="target-phrase">the quick brown fox jumps over the lazy dog</div>
        <textarea id="inputField" placeholder="Type the phrase above..." disabled></textarea>
        <div class="status-bar"><div class="status-fill" id="progressBar"></div></div>
        <div class="tip">Mistake? Press <strong>Backspace</strong> to reset.</div>
    </div>

    <div id="resultBox" class="result-overlay"></div>
    
    <button id="resetBtn" onclick="fullReset()" style="display:none; margin-top: 15px;">Try Again</button>
</div>

<script>
    const API_URL = "";
    const TARGET = "the quick brown fox jumps over the lazy dog";
    let keystrokes = [];
    let keyPressMap = {};

    // 1. Load Users
    async function loadUsers() {
        try {
            const res = await fetch(`${API_URL}/users`);
            const users = await res.json();
            const select = document.getElementById('userSelect');
            select.innerHTML = '<option value="">-- Select Identity --</option>';
            users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                let cleanName = u.replace('user_', '');
                cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
                opt.textContent = cleanName;
                select.appendChild(opt);
            });
        } catch(e) {
            alert("Ensure app.py is running!");
        }
    }
    loadUsers();

    // 2. Enable typing
    document.getElementById('userSelect').addEventListener('change', (e) => {
        const input = document.getElementById('inputField');
        input.disabled = !e.target.value;
        if(!input.disabled) input.focus();
    });

    // 3. Keystroke Recording Logic
    const input = document.getElementById('inputField');
    
    // KEYDOWN: Handle Backspace Reset
    input.addEventListener('keydown', (e) => {
        // Prevent Enter
        if(e.key === 'Enter') { e.preventDefault(); return; }

        // NEW: Backspace clears everything
        if (e.key === 'Backspace') {
            e.preventDefault();
            clearTypingData(); // Call the helper to clear text
            return;
        }

        if(!keyPressMap[e.code]) keyPressMap[e.code] = Date.now();
    });

    // KEYUP: Record timing
    input.addEventListener('keyup', (e) => {
        if (e.key === 'Backspace' || e.key === 'Enter') return;

        const releaseTime = Date.now();
        const pressTime = keyPressMap[e.code];
        
        if (pressTime) {
            const prevRelease = keystrokes.length > 0 ? keystrokes[keystrokes.length-1].releaseTime : pressTime;
            
            keystrokes.push({
                key: e.key,
                pressTime: pressTime,
                releaseTime: releaseTime,
                dwellTime: releaseTime - pressTime,
                flightTime: pressTime - prevRelease
            });
            delete keyPressMap[e.code];
        }
        
        checkProgress();
    });

    // INPUT: Visual Feedback (Red/Green)
    input.addEventListener('input', () => {
        const val = input.value.toLowerCase();
        
        // Check if what we have typed so far matches the start of TARGET
        if (TARGET.startsWith(val)) {
            input.classList.add("success");
            input.classList.remove("error");
        } else {
            input.classList.add("error");
            input.classList.remove("success");
        }
    });

    function checkProgress() {
        const currentText = input.value;
        const progress = (currentText.length / TARGET.length) * 100;
        document.getElementById('progressBar').style.width = `${Math.min(progress, 100)}%`;

        if (currentText === TARGET) {
            submitVerification();
        }
    }

    // Helper: Clears only the typing data (for Backspace)
    function clearTypingData() {
        keystrokes = [];
        keyPressMap = {};
        input.value = '';
        input.classList.remove("success", "error");
        document.getElementById('progressBar').style.width = '0%';
    }

    // Helper: Full Reset (for Try Again button)
    function fullReset() {
        clearTypingData();
        input.disabled = false;
        input.focus();
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'none';
    }
    let verificationInProgress = false;

    async function submitVerification() {
        if (verificationInProgress) return;
        verificationInProgress = true;
        const userId = document.getElementById('userSelect').value;
        let displayName = userId.replace('user_', '');
        displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);

        input.disabled = true;
        
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        resultBox.className = 'result-overlay';
        resultBox.innerHTML = 'Analyzing biometric pattern...';

        try {
            const res = await fetch(`${API_URL}/verify`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userId: userId,
                    keystrokeData: keystrokes
                })
            });
            
            const data = await res.json();
            
            if (data.authenticated) {
                resultBox.className = 'result-overlay success-box';
                resultBox.innerHTML = `
                    <h3>✅ Access Granted</h3>
                    <p>Identity verified as <strong>${displayName}</strong></p> <small>Score: ${data.score.toFixed(3)}</small>
                `;
            } else {
                resultBox.className = 'result-overlay fail-box';
                resultBox.innerHTML = `
                    <h3>⛔ Access Denied</h3>
                    <p>Typing pattern mismatch for <strong>${displayName}</strong>.</p> <small>Score: ${data.score.toFixed(3)}</small>
                `;
            }
            
            document.getElementById('resetBtn').style.display = 'block';
            verificationInProgress = false;

        } catch (e) {
            resultBox.innerHTML = 'Error contacting server.';
        }
    }
</script>

</body>
</html>
